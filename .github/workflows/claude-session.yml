name: claude-session

# Reusable headless Claude Code session — the one place the CLI invocation
# lives, so every station (factory-run, on-issue, on-pr, nightly-eval) runs
# identically and a fix lands once. Sessions load THIS repo as the active
# plugin (--plugin-dir .) so the factory dogfoods its own hooks; the
# marketplace copy is disabled in-session to avoid double-loading.
#
# Identity: each caller targets a role environment (triage/reviewer/coder/…)
# holding that role's GitHub App id (APP_ID env variable) + private key
# (APP_PRIVATE_KEY env secret). Pushes made with the minted app token DO
# trigger workflows (default GITHUB_TOKEN pushes do not — ADR 0002), and the
# environment scoping means a triage session physically cannot read the
# release key. Fallback order: app token → FACTORY_PAT → GITHUB_TOKEN.

on:
  workflow_call:
    inputs:
      station:
        description: station name (checkpointing + cost records key off it)
        required: true
        type: string
      prompt:
        description: the station prompt (passed to claude -p via env, never inlined in shell)
        required: true
        type: string
      environment:
        description: role environment holding APP_ID / APP_PRIVATE_KEY
        required: true
        type: string
      model:
        type: string
        default: sonnet
      effort:
        description: low|medium|high|xhigh|max|ultracode — routed per factory-ops/cost/ROUTING.md
        type: string
        default: high
      max_turns:
        type: number
        default: 120
      runner:
        description: "'icculus' targets [self-hosted, icculus]; anything else is a hosted label"
        type: string
        default: ubuntu-latest
      timeout_minutes:
        type: number
        default: 120
      permission_mode:
        description: bypassPermissions for trusted stations in ephemeral runners; dontAsk + allowed_tools for inbound-facing ones
        type: string
        default: bypassPermissions
      allowed_tools:
        description: optional --allowedTools rule list (least-privilege stations)
        type: string
        default: ""

# NO permissions block here — deliberately, and it must stay that way.
#
# For a reusable workflow, the CALLER's job-level `permissions` is the ceiling
# and anything declared here can only DOWNGRADE it, never raise it ("The
# GITHUB_TOKEN permissions passed from the caller workflow can be only
# downgraded (not elevated) by the called workflow"). A block here therefore
# caps every station at once: the `contents: read` that used to sit here left
# the review station unable to post its review, the triage station unable to
# label, and factory-run unable to push — after running a full 37-minute
# session and reporting success (#97). Each caller declares exactly what its
# own station needs; see tests/scaffold.contract.test.sh, which fails if this
# block ever comes back or if a caller stops declaring its set.
#
# One scope is unreachable this way: `workflows` is not a GITHUB_TOKEN
# permission at all, so no caller can grant it. A station that edits files
# under .github/workflows/ needs a role App token (or FACTORY_PAT) — with the
# default token those pushes are rejected by GitHub, by design.

jobs:
  session:
    if: vars.FACTORY_HALT != 'true'
    runs-on: ${{ inputs.runner == 'icculus' && fromJSON('["self-hosted","icculus"]') || inputs.runner }}
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: mint app token (when this role has an app)
        id: app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: resolve git identity + token
        id: ident
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
          FALLBACK: ${{ github.token }}
        run: |
          token="${APP_TOKEN:-${FACTORY_PAT:-$FALLBACK}}"
          slug="${APP_SLUG:-dsf-factory}"
          { echo "token=$token"; echo "slug=$slug"; } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$token"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ steps.ident.outputs.token }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with: { node-version: 22 }

      # Pin ≥ 2.1.203: dynamic workflows + the ultracode effort setting need it.
      - name: install pinned claude-code CLI
        run: npm install -g "@anthropic-ai/claude-code@${{ vars.CLAUDE_CODE_VERSION || '2.1.218' }}"

      - name: session identity
        env:
          SLUG: ${{ steps.ident.outputs.slug }}
        run: |
          git config user.name "${SLUG}[bot]"
          git config user.email "${SLUG}[bot]@users.noreply.github.com"

      # Claude Code in CI authenticates with EITHER credential; a repo that holds
      # the one we don't pass runs every station unauthenticated. Fail here,
      # loudly and early, rather than letting the session no-op (see the result
      # guard below for why a no-op is otherwise invisible).
      - name: require a Claude credential
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$APIKEY" ]; then
            echo "::error::No Claude credential configured for the '${{ inputs.environment }}' environment." \
                 "Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a repository secret (bootstrap.sh does this)."
            exit 1
          fi

      # Session telemetry → the icculus collector → Langfuse. Gated twice, and
      # both gates matter: the endpoint is a factory-net DNS name that only the
      # self-hosted runner can resolve, and bootstrap.sh sets the variable only
      # against a collector it proved healthy. A hosted runner (or a host with
      # no stack) therefore exports nothing rather than paying retry timeouts on
      # every API call for telemetry that can never arrive.
      #
      # Content capture is pinned OFF explicitly below — OTEL_LOG_USER_PROMPTS,
      # OTEL_LOG_ASSISTANT_RESPONSES, OTEL_LOG_TOOL_DETAILS,
      # OTEL_LOG_TOOL_CONTENT, OTEL_LOG_RAW_API_BODIES all set to 0, rather than
      # left to the CLI's defaults. Stations read untrusted issue/PR text and
      # hold minted App tokens; what ships is shape (models, tokens, cost,
      # duration, tool names, decisions), never content. Turning any of them on
      # is a security decision, not a verbosity one — see
      # tests/observability.contract.test.sh, which requires the literal `=0`.
      - name: point session telemetry at the factory collector
        if: inputs.runner == 'icculus' && vars.FACTORY_OTEL_ENDPOINT != ''
        env:
          OTEL_ENDPOINT: ${{ vars.FACTORY_OTEL_ENDPOINT }}
          SESSION_STATION: ${{ inputs.station }}
          SESSION_MODEL: ${{ inputs.model }}
          SESSION_EFFORT: ${{ inputs.effort }}
        run: |
          # OTEL_RESOURCE_ATTRIBUTES is comma/equals delimited, so ANY value
          # carrying one of those splits a single attribute into two and
          # corrupts every attribute after it. Sanitize all of them, not just
          # the obviously free-text workflow name: station/model/effort are
          # fixed strings from this repo's own workflows today, but they are
          # `inputs.*` on a reusable workflow, and the first caller to thread a
          # less-trusted value through one would inherit the gap.
          #
          # NEWLINES ARE IN THE CLASS FOR A DIFFERENT REASON, and it is the
          # serious one: these values are echoed into $GITHUB_ENV, which is
          # line-oriented. An embedded newline stops being a corrupt attribute
          # and becomes an injected environment variable in the next step — the
          # one holding the minted App token and the Claude credential. Stripping
          # only the delimiters would close the cosmetic half of the hole.
          strip=$'\n\r ,='
          wf="${GITHUB_WORKFLOW//[$strip]/_}"
          st="${SESSION_STATION//[$strip]/_}"
          md="${SESSION_MODEL//[$strip]/_}"
          ef="${SESSION_EFFORT//[$strip]/_}"
          {
            # The factory's OWN gate metrics (factory_gate_*, factory_commits_*)
            # ride the same collector. Env, not .factory/config.json: that file
            # is a hook-managed trust root and editing it here would dirty the
            # tree the green receipt is bound to.
            echo "FACTORY_OTEL_ENDPOINT=$OTEL_ENDPOINT"
            echo "CLAUDE_CODE_ENABLE_TELEMETRY=1"
            echo "CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1"
            echo "OTEL_TRACES_EXPORTER=otlp"
            echo "OTEL_METRICS_EXPORTER=otlp"
            echo "OTEL_LOGS_EXPORTER=otlp"
            # http/protobuf, not the gRPC default: the collector exposes only
            # :4318, the same port the hooks' otel_emit already posts to.
            echo "OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=$OTEL_ENDPOINT"
            echo "OTEL_SERVICE_NAME=dark-software-factory"
            echo "OTEL_RESOURCE_ATTRIBUTES=factory.station=$st,factory.model=$md,factory.effort=$ef,factory.repo=$GITHUB_REPOSITORY,factory.run_id=$GITHUB_RUN_ID,factory.workflow=$wf"
            # A station can finish inside one export interval; flush often
            # enough that a short run is not invisible.
            echo "OTEL_METRIC_EXPORT_INTERVAL=10000"
            echo "OTEL_LOGS_EXPORT_INTERVAL=5000"
            # Redaction, stated rather than inherited. These are already the
            # CLI's defaults, but a default is a property of the pinned version,
            # and CLAUDE_CODE_VERSION moves. The claim this stack makes — no
            # session content reaches the trace store — must not quietly become
            # false because an upstream default flipped in a version bump.
            # Setting them to 0 explicitly makes it our guarantee, not the
            # CLI's, and the contract test asserts these exact lines.
            echo "OTEL_LOG_USER_PROMPTS=0"
            echo "OTEL_LOG_ASSISTANT_RESPONSES=0"
            echo "OTEL_LOG_TOOL_DETAILS=0"
            echo "OTEL_LOG_TOOL_CONTENT=0"
            echo "OTEL_LOG_RAW_API_BODIES=0"
          } >> "$GITHUB_ENV"
          echo "telemetry → $OTEL_ENDPOINT (station=$SESSION_STATION)"

      - name: run station session
        shell: bash   # pipefail: without it `tee` masks the CLI's exit status
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.ident.outputs.token }}
          SESSION_PROMPT: ${{ inputs.prompt }}
          SESSION_STATION: ${{ inputs.station }}
          ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        run: |
          extra=()
          if [ -n "$ALLOWED_TOOLS" ]; then extra+=(--allowedTools "$ALLOWED_TOOLS"); fi
          claude -p "$SESSION_PROMPT" \
            --plugin-dir "$GITHUB_WORKSPACE" \
            --settings '{"enabledPlugins":{"dark-software-factory@software-factory":false}}' \
            --permission-mode "${{ inputs.permission_mode }}" \
            --model "${{ inputs.model }}" \
            --effort "${{ inputs.effort }}" \
            --max-turns "${{ inputs.max_turns }}" \
            --output-format json \
            "${extra[@]}" | tee "$RUNNER_TEMP/session-result.json"

      # `claude -p --output-format json` EXITS 0 even when the run failed — the
      # failure lives in the result JSON ("is_error": true, e.g. "Not logged in").
      # Without this guard a station reports success while doing nothing at all,
      # and cron-prod re-dispatches that same no-op every hour: false green, the
      # one failure mode a lights-out factory cannot survive.
      - name: fail when the session reported an error
        run: |
          f="$RUNNER_TEMP/session-result.json"
          if [ ! -s "$f" ]; then
            echo "::error::The station produced no result JSON — the session did not run."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let o;
            try { o = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); }
            catch (e) { console.log("::error::Unparseable session result: " + e.message); process.exit(1); }
            if (o.is_error) {
              console.log("::error::Station failed: " + (o.result || o.subtype || "unknown error"));
              process.exit(1);
            }
            console.log("station completed: " + (o.num_turns ?? "?") + " turns");
          ' "$f"

      # factory-run's own mandate (see factory-run.yml's prompt) is a commit and
      # a PR — "producing only a status report is a FAILURE". The is_error guard
      # above cannot see that failure mode: `claude -p` ends cleanly (end_turn)
      # even when the session did nothing but orient and stop, so the job goes
      # green while the loop never advances (observed live: GH Actions run
      # 30490944976 — oriented, hit a couple of Bash permission_denials on raw
      # plumbing commands, then answered with a status dashboard and quit; no
      # commit, no PR, no checkpoint update, four days stale). This check has to
      # live HERE, not as a follow-up job in factory-run.yml: a job that calls a
      # reusable workflow via `uses:` cannot hold any other steps, so this is the
      # only place with access to the actual git workspace the session leaves
      # behind — whatever local commits/branches it made, pushed or not, on top
      # of the SHA this job started at (`github.sha` here is the same context
      # value the caller had, since a `uses:`-called workflow runs inside the
      # caller's own run). Scoped to the factory-run station only: other
      # stations (review/triage/nightly-eval) can legitimately end a run with no
      # commit at all.
      - name: fail when factory-run reports success without a real deliverable
        if: inputs.station == 'factory-run'
        run: |
          base="${{ github.sha }}"
          # --all, not just HEAD: the session may have `git checkout`-ed back to
          # the starting branch after pushing a feature branch elsewhere, which
          # would otherwise hide a real commit behind an unchanged HEAD.
          new_commits="$(git rev-list --all --not "$base")"
          if [ -z "$new_commits" ]; then
            echo "::error::factory-run session reported success but left no new commit anywhere in the workspace since it started at $base — no PR, no checkpoint update, nothing landed. Producing only a status report is a FAILURE per the conductor's mandate."
            exit 1
          fi
          if git log --all --not "$base" --name-only --pretty=format: | grep -qx 'factory-ops/state/checkpoint.json'; then
            echo "checkpoint.json changed in a new commit — real deliverable confirmed."
          else
            echo "$(printf '%s\n' "$new_commits" | wc -l) new commit(s) landed since dispatch — real deliverable confirmed."
          fi

      # Cost telemetry (efficiency program): usage + duration per station to the
      # job summary and an artifact; the efficiency engineer's ingestion turns
      # these into factory-ops/cost/ records and the retro trend.
      - name: record cost summary
        if: always()
        env:
          SESSION_STATION: ${{ inputs.station }}
          SESSION_MODEL: ${{ inputs.model }}
          SESSION_EFFORT: ${{ inputs.effort }}
        run: |
          if [ -f "$RUNNER_TEMP/session-result.json" ]; then
            node -e '
              const fs = require("fs");
              let o = {};
              try { o = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/session-result.json", "utf8")); } catch (e) {}
              const row = {
                station: process.env.SESSION_STATION,
                model: process.env.SESSION_MODEL,
                effort: process.env.SESSION_EFFORT,
                cost_usd: o.total_cost_usd ?? null,
                duration_ms: o.duration_ms ?? null,
                turns: o.num_turns ?? null,
                usage: o.usage ?? null,
                is_error: o.is_error ?? null,
              };
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```json\n" + JSON.stringify(row, null, 2) + "\n```\n");
            '
          fi

      - name: upload session result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-${{ inputs.station }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/session-result.json
          if-no-files-found: ignore
          retention-days: 30
